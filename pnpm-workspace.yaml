packages:
  - "apps/*"
  - "packages/*"
enableGlobalVirtualStore: false
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  core-js-pure: false
  prisma: true
  sharp: true
  tree-sitter: false
  tree-sitter-json: false
